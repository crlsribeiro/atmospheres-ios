name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild build \
            -project Atmospheres/Atmospheres.xcodeproj \
            -scheme Atmospheres \
            -destination 'generic/platform=iOS Simulator'

      - name: Test
        run: |
          xcodebuild test \
            -project Atmospheres/Atmospheres.xcodeproj \
            -scheme Atmospheres \
            -destination 'generic/platform=iOS Simulator'
