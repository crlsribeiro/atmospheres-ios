name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List compatible runtimes
        run: xcrun simctl list runtimes

      - name: Build (generic simulator destination)
        run: |
          xcodebuild build \
            -project Atmospheres/Atmospheres.xcodeproj \
            -scheme Atmospheres \
            -destination 'generic/platform=iOS Simulator'
