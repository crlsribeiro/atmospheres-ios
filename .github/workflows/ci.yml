name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create and boot a fresh simulator
        id: simulator
        run: |
          sudo xcodebuild -runFirstLaunch
          RUNTIME=$(xcrun simctl list runtimes available | grep -E "iOS" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+')
          echo "Using runtime: $RUNTIME"
          DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -m1 "iPhone" | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
          echo "Using device type: $DEVICE_TYPE"
          UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator: $UDID"
          xcrun simctl boot "$UDID"
          echo "device_id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project Atmospheres/Atmospheres.xcodeproj \
            -scheme Atmospheres \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}"

      - name: Test
        run: |
          xcodebuild test \
            -project Atmospheres/Atmospheres.xcodeproj \
            -scheme Atmospheres \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}"
